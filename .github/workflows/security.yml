name: Security
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  codeql:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
  secret-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject wallet and credential material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIE '(walletSeed|privateKey|spendKey|viewKey|mnemonic|clientSecret|accessToken)[[:space:]]*[:=][[:space:]]*["'''][^"''']+' -- . ':(exclude)ontology/xuniaxmr.ontology.json' ':(exclude)scripts/validate_ontology.py'; then
            echo "::error::Potential credential or wallet secret committed"
            exit 1
          fi
